<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sword Combo Lab · 七分镜剑技</title>
<style>
:root{--ink:#111;--paper:#f4f0e6;--line:#d8d0bd;--accent:#a35b24;--muted:#777}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans CJK SC",sans-serif}
main{max-width:1120px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 4px}.sub{color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:18px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}
canvas{width:100%;height:auto;display:block;background:#fff;border-radius:10px}
.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:12px}
button{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer;font:inherit}
button:hover{border-color:var(--accent);color:var(--accent)}button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
label{font-size:14px;color:#444}input[type=range]{accent-color:var(--accent)}
.timeline{width:100%;accent-color:var(--accent);margin-top:12px}
.phase{display:flex;gap:2px;margin-top:10px}.phase div{flex:1;text-align:center;font-size:11px;padding:5px 2px;border-radius:5px;background:#eee;color:#666}
.phase div.on{background:var(--accent);color:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;font-size:13px}.stat{background:#faf8f2;border:1px solid #ece6d8;border-radius:8px;padding:7px 9px}.stat b{display:block;font-size:17px;margin-top:2px}
.note{color:var(--muted);font-size:13px;line-height:1.6}pre{white-space:pre-wrap;background:#faf8f2;border:1px solid #ece6d8;border-radius:9px;padding:10px;font-size:11px;max-height:210px;overflow:auto}
</style></head><body><main>
<h1>Sword Combo Lab · 七分镜剑技</h1>
<div class="sub">按“小小动画打斗招式分镜头”手工重构：起手 → 蓄力 → 突刺 → 格挡 → 旋身 → 低位 → 收势。腿是两段骨骼，剑是独立角度。</div>
<div class="grid">
<div class="card">
<canvas id="c" width="800" height="600"></canvas>
<input id="seek" class="timeline" type="range" min="0" max="1000" value="0">
<div class="controls">
<button class="primary" id="play">播放</button>
<button id="reset">回到起点</button>
<button id="prev">上一帧</button>
<button id="next">下一帧</button>
<label>速度 <input id="speed" type="range" min="0.25" max="2" step="0.05" value="0.85"></label>
<label><input id="mirror" type="checkbox"> 镜像</label>
<label><input id="joints" type="checkbox" checked> 关节</label>
<label><input id="trail" type="checkbox" checked> 剑迹</label>
</div>
<div class="phase" id="phasebar"></div>
<div class="note" id="readout" style="margin-top:10px"></div>
</div>
<div>
<div class="card">
<h3 style="margin:0 0 8px">动作评估</h3>
<div class="stats" id="stats"></div>
<div class="note" id="warnings" style="margin-top:10px"></div>
</div>
<div class="card" style="margin-top:14px">
<h3 style="margin:0 0 8px">七分镜</h3>
<pre id="dump"></pre>
</div>
</div>
</div>
<p class="note">这是“分镜草案”，不是从原图自动提取的骨骼。AI 分镜中的手/剑/腿有局部不一致，这里按可动画的骨架重新解释。</p>
</main>
<script>
const S={headR:9,torso:36,hipH:64,upperArm:21,forearm:21,thigh:32,shin:33,foot:7,shoulderW:20,hipW:12,ground:244};
const KF=[
 {t:0.00,torso:-82,head:-88,uaF:50,faF:-92,uaB:118,faB:-30,thF:52,shF:88,thB:104,shB:126,dx:0,dy:0,rot:0,sword:155,label:'起手'},
 {t:0.12,torso:-105,head:-94,uaF:120,faF:65,uaB:145,faB:55,thF:66,shF:122,thB:90,shB:130,dx:-8,dy:3,rot:0,sword:205,label:'蓄力'},
 {t:0.22,torso:-72,head:-82,uaF:0,faF:0,uaB:140,faB:60,thF:20,shF:20,thB:105,shB:130,dx:18,dy:5,rot:0,sword:0,label:'突刺'},
 {t:0.32,torso:-96,head:-90,uaF:-58,faF:-62,uaB:-20,faB:-80,thF:70,shF:112,thB:96,shB:122,dx:10,dy:2,rot:0,sword:-78,label:'格挡'},
 {t:0.45,torso:-88,head:-92,uaF:132,faF:88,uaB:52,faB:-58,thF:60,shF:100,thB:92,shB:122,dx:4,dy:-2,rot:-120,sword:150,label:'旋身'},
 {t:0.60,torso:-80,head:-88,uaF:42,faF:18,uaB:100,faB:-30,thF:5,shF:5,thB:100,shB:130,dx:8,dy:7,rot:-300,sword:82,label:'低位'},
 {t:0.75,torso:-82,head:-88,uaF:50,faF:-92,uaB:118,faB:-30,thF:52,shF:88,thB:104,shB:126,dx:0,dy:0,rot:-360,sword:155,label:'收势'}
];
const DUR=0.85,FIELDS=['torso','head','uaF','faF','uaB','faB','thF','shF','thB','shB','dx','dy','rot','sword'];
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=c.width,H=c.height,SC=2;
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
const lerp=(a,b,t)=>a+(b-a)*t;
function sample(t){
 t=Math.max(0,Math.min(DUR,t));let i=0;while(i<KF.length-2&&t>KF[i+1].t)i++;
 const a=KF[i],b=KF[i+1],u=smooth((t-a.t)/Math.max(1e-6,b.t-a.t)),p={};
 for(const f of FIELDS)p[f]=lerp(a[f],b[f],u);p.t=t;return p;
}
function pol(d,l){const r=d*Math.PI/180;return{x:Math.cos(r)*l,y:Math.sin(r)*l}}
function add(a,b){return{x:a.x+b.x,y:a.y+b.y}}
function skeleton(p,mirror){
 const td=pol(p.torso,1),ax={x:-Math.sin(p.torso*Math.PI/180),y:Math.cos(p.torso*Math.PI/180)};
 const hip={x:0,y:0},neck={x:td.x*S.torso,y:td.y*S.torso},head=add(neck,pol(p.head,S.headR-1));
 const sc={x:neck.x-td.x*3,y:neck.y-td.y*3};
 const shF={x:sc.x+ax.x*S.shoulderW/2,y:sc.y+ax.y*S.shoulderW/2},shB={x:sc.x-ax.x*S.shoulderW/2,y:sc.y-ax.y*S.shoulderW/2};
 const hiF={x:ax.x*S.hipW/2,y:ax.y*S.hipW/2},hiB={x:-ax.x*S.hipW/2,y:-ax.y*S.hipW/2};
 const elF=add(shF,pol(p.uaF,S.upperArm)),haF=add(elF,pol(p.faF,S.forearm));
 const elB=add(shB,pol(p.uaB,S.upperArm)),haB=add(elB,pol(p.faB,S.forearm));
 const knF=add(hiF,pol(p.thF,S.thigh)),ftF=add(knF,pol(p.shF,S.shin));
 const knB=add(hiB,pol(p.thB,S.thigh)),ftB=add(knB,pol(p.shB,S.shin));
 let o={hip,neck,head,shF,shB,elF,haF,elB,haB,hiF,hiB,knF,ftF,knB,ftB};
 if(p.rot){const r=p.rot*Math.PI/180,co=Math.cos(r),si=Math.sin(r);for(const k in o){const q=o[k];o[k]={x:q.x*co-q.y*si,y:q.x*si+q.y*co}}}
 // sword in local space, rotates with body
 const sa=(p.sword+p.rot)*Math.PI/180;
 o.swordHilt=o.haF;o.swordTip={x:o.haF.x+Math.cos(sa)*78,y:o.haF.y+Math.sin(sa)*78};
 o.swordGuard={x:o.haF.x+Math.cos(sa+Math.PI/2)*7,y:o.haF.y+Math.sin(sa+Math.PI/2)*7};
 o.swordGuard2={x:o.haF.x-Math.cos(sa+Math.PI/2)*7,y:o.haF.y-Math.sin(sa+Math.PI/2)*7};
 if(mirror)for(const k in o)o[k].x*=-1;
 return o;
}
function world(s,p,mirror){
 const gy=(S.ground-S.hipH+p.dy)*SC, x=W/2+p.dx*(mirror?-1:1)*SC, o={};
 for(const k in s)o[k]={x:x+s[k].x*SC,y:gy+s[k].y*SC};o.ground=S.ground*SC;return o;
}
const pairs=[['hip','neck',8],['hiF','hiB',5],['shF','shB',5],['shF','elF',6],['elF','haF',6],['hiF','knF',6],['knF','ftF',6],['shB','elB',4],['elB','haB',4],['hiB','knB',4],['knB','ftB',4]];
function line(a,b,w,col='#111'){ctx.strokeStyle=col;ctx.lineWidth=w*SC;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function drawSword(s,opt,base){
 if(opt.trail){for(let k=1;k<=6;k++){const q=sample(Math.max(0,base-k*0.025));const g=world(skeleton(q,opt.mirror),q,opt.mirror);ctx.globalAlpha=0.22-(k*0.025);ctx.strokeStyle='#666';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(g.swordHilt.x,g.swordHilt.y);ctx.lineTo(g.swordTip.x,g.swordTip.y);ctx.stroke();}ctx.globalAlpha=1}
 ctx.strokeStyle='#111';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(s.swordHilt.x,s.swordHilt.y);ctx.lineTo(s.swordTip.x,s.swordTip.y);ctx.stroke();
 ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(s.swordGuard.x,s.swordGuard.y);ctx.lineTo(s.swordGuard2.x,s.swordGuard2.y);ctx.stroke();
}
function draw(t,opt={}){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 const p=sample(t),s=world(skeleton(p,opt.mirror),p,opt.mirror);
 ctx.fillStyle='#eee';ctx.fillRect(0,s.ground,W,3);
 if(t>0.38&&t<0.68){ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.hip.x,s.hip.y,105*SC,0.1,Math.PI*1.6);ctx.stroke()}
 if(opt.trail)drawSword(s,opt,t);else{ctx.strokeStyle='#111';ctx.lineWidth=4.5;ctx.beginPath();ctx.moveTo(s.swordHilt.x,s.swordHilt.y);ctx.lineTo(s.swordTip.x,s.swordTip.y);ctx.stroke()}
 for(const [a,b,w] of pairs)line(s[a],s[b],w);
 line(s.ftF,{x:s.ftF.x+(opt.mirror?-S.foot:S.foot)*SC,y:s.ftF.y},6);
 line(s.ftB,{x:s.ftB.x+(opt.mirror?-S.foot:S.foot)*SC,y:s.ftB.y},4);
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(s.head.x,s.head.y,S.headR*SC,0,Math.PI*2);ctx.fill();
 if(t>0.29&&t<0.36){ctx.strokeStyle='#a35b24';ctx.lineWidth=2;for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(s.head.x+Math.cos(a)*20,s.head.y+Math.sin(a)*20);ctx.lineTo(s.head.x+Math.cos(a)*40,s.head.y+Math.sin(a)*40);ctx.stroke()}}
 if(opt.joints){ctx.fillStyle='#a35b24';for(const k of ['hip','neck','shF','shB','elF','elB','haF','haB','hiF','hiB','knF','knB','ftF','ftB']){ctx.beginPath();ctx.arc(s[k].x,s[k].y,3,0,Math.PI*2);ctx.fill()}}
 ctx.fillStyle='#555';ctx.font='13px system-ui';ctx.fillText(`t=${t.toFixed(2)}s  frame=${Math.round(t*60)} / ${Math.round(DUR*60)}`,16,24);
 ctx.fillText(`rot=${p.rot.toFixed(0)}°  kneeF=${(p.shF-p.thF).toFixed(0)}°  kneeB=${(p.shB-p.thB).toFixed(0)}°  sword=${p.sword.toFixed(0)}°`,16,44);
 ctx.fillText(`阶段: ${phaseAt(t)}`,16,64);
}
function phaseAt(t){let i=0;for(let k=1;k<KF.length;k++)if(t>=KF[k].t)i=k;return KF[i].label}
let playing=false,time=0,speed=0.85,opt={mirror:false,joints:true,trail:true},last=0;
function frame(ts){if(!playing)return;const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;time+=dt*speed;if(time>DUR)time=0;document.getElementById('seek').value=time/DUR*1000;draw(time,opt);requestAnimationFrame(frame)}
document.getElementById('play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';last=performance.now();if(playing)requestAnimationFrame(frame)};
document.getElementById('reset').onclick=()=>{playing=false;document.getElementById('play').textContent='播放';time=0;document.getElementById('seek').value=0;draw(0,opt)};
document.getElementById('seek').oninput=e=>{time=e.target.value/1000*DUR;draw(time,opt)};
document.getElementById('speed').oninput=e=>speed=+e.target.value;
document.getElementById('mirror').onchange=e=>{opt.mirror=e.target.checked;draw(time,opt)};
document.getElementById('joints').onchange=e=>{opt.joints=e.target.checked;draw(time,opt)};
document.getElementById('trail').onchange=e=>{opt.trail=e.target.checked;draw(time,opt)};
function step(d){playing=false;document.getElementById('play').textContent='播放';const f=Math.max(0,Math.min(Math.round(DUR*60),Math.round(time*60)+d));time=f/60;document.getElementById('seek').value=time/DUR*1000;draw(time,opt)}
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
function metrics(){
 const n=120,a=[];for(let i=0;i<=n;i++)a.push(sample(i/n*DUR));let maxV=0,travel=Math.abs(a[n].dx-a[0].dx);
 for(let i=1;i<=n;i++){let v=0;for(const f of FIELDS)v+=Math.abs(a[i][f]-a[i-1][f]);maxV=Math.max(maxV,v/(DUR/n))}
 return{maxV,travel};
}
function renderStats(){
 const m=metrics();document.getElementById('stats').innerHTML=`<div class="stat">时长<b>${DUR.toFixed(2)} s</b></div><div class="stat">根位移<b>${m.travel.toFixed(0)} px</b></div><div class="stat">最大角速度<b>${m.maxV.toFixed(0)}</b></div><div class="stat">关键姿态<b>${KF.length}</b></div>`;
 let w=[];if(m.maxV>2200)w.push('角速度偏大，可能看不清');if(m.travel>40)w.push('根位移偏大，检查滑步');document.getElementById('warnings').innerHTML=w.length?'<span style="color:#a12">'+w.join('；')+'</span>':'<span style="color:#276b3a">未发现明显阈值问题</span>';
 const bar=document.getElementById('phasebar');bar.innerHTML=KF.map((k,i)=>{const a=k.t,b=KF[i+1]?KF[i+1].t:DUR;return `<div data-a="${a}" data-b="${b}">${k.label}</div>`}).join('');
}
function updatePhase(t){document.querySelectorAll('#phasebar div').forEach(d=>{const a=+d.dataset.a,b=+d.dataset.b;d.classList.toggle('on',t>=a&&t<=(b+0.001))})}
const oldDraw=draw;draw=function(t,o){oldDraw(t,o);updatePhase(t)};
document.getElementById('dump').textContent=JSON.stringify(KF,null,1);
renderStats();draw(0,opt);
</script></body></html>
